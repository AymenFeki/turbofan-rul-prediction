[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rul"
version = "0.2.0"
description = "Remaining useful life prediction on NASA C-MAPSS"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "torch>=2.0",
    "optuna>=3.4",
    "shap>=0.44",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
rul = "rul.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
exclude = ["outputs", "CMAPSSData"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
